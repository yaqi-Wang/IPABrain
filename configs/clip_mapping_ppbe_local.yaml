brainvae_config: configs/brainvae_scheme1_ppbe.yaml
run_name: tokenformer_ppbe_local
output_root: outputs/ppbe_comparison
log_root: logs/clip_mapping_ppbe_local
model:
  type: tokenformer
  latent_tokens: 256
  embed_dim: 1664
  hidden_dim: 512
  depth: 8
  num_heads: 8
  mlp_ratio: 4.0
  dropout: 0.1
training:
  seed: 42
  batch_size: 12
  epochs: 30
  learning_rate: 0.0001
  weight_decay: 0.01
  checkpoint_every_steps: 100
  num_workers: 0
  encode_batch_size: 2
validation:
  selection_metric: token_mse
  patience: 10
  min_delta: 0.0001
  batch_size: 12
evaluation:
  aggregation: mean_fmri
  encode_batch_size: 2
  num_samples: 3
  num_steps: 38
  seed: 42
  rgb_mode: standard
  token_source_tag: mapped_mean_fmri
  generation_tag: mapped_mean_fmri_rgb01_s3
