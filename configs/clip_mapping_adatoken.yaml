# Method 3: the original SiT backbone, trained in the mean-to-CLIP direction.
# Share exactly the same frozen encoder and posterior-mean rows as TokenFormer.
brainvae_config: configs/brainvae_scheme1_mean_nomse.yaml
mean_cache_run: tokenformer
run_name: adatoken
output_root: outputs/scheme1_direct
log_root: logs/clip_mapping_adatoken
model:
  type: adatoken
  latent_tokens: 256
  embed_dim: 1664
  depth: 8
  num_heads: 13
  mlp_ratio: 4.0
  fused_attn: true
  qk_norm: false
  gradient_checkpointing: true
training:
  seed: 42
  batch_size: 12
  micro_batch_size: 3
  mixed_precision: fp16
  allow_tf32: true
  epochs: 30
  learning_rate: 0.0001
  weight_decay: 0.01
  checkpoint_every_steps: 500
  num_workers: 0
  encode_batch_size: 8
validation:
  selection_metric: token_mse
  patience: 10
  min_delta: 0.0001
  batch_size: 12
evaluation:
  aggregation: mean_fmri
  encode_batch_size: 3
  num_samples: 3
  num_steps: 38
  seed: 42
  rgb_mode: standard
  token_source_tag: mapped_mean_fmri
  generation_tag: mapped_mean_fmri_rgb01_s3
