paths: configs/paths.example.yaml
model:
  latent_tokens: 256
  embed_dim: 1664
  hidden_channels: 128
  hidden_dim: 4096
  linear_dim: 2048
  kl_weight: 0.001
  clip_weight: 1000.0
  free_bits: 0.5
  ddconfig:
    z_channels: 256
    in_channels: 1
    out_ch: 1
    ch: 128
    ch_mult: [2, 4, 4]
    ada_length: 8192
    num_res_blocks: 2
    num_down_blocks: 1
    num_up_blocks: 1
    attn_resolutions: []
    dropout: 0.0
    resamp_with_conv: true
    mid_attn_type: linear
    block_attn_type: none
training:
  batch_size: 42
  epochs: 30
  learning_rate: 0.0001
  weight_decay: 0.05
  num_workers: 0
  kl_warmup_epochs: 2
  kl_ramp_epochs: 5
validation:
  enabled: true
  patience: 10
  min_delta: 0.0001
