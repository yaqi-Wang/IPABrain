# Independent original-architecture run. Existing BrainVAE configs are unchanged.
paths: configs/paths.example.yaml
model:
  architecture: ppbe
  latent_tokens: 256
  embed_dim: 1664
  hidden_channels: 128
  hidden_dim: 4096
  linear_dim: 2048
  semantic_source: sample
  clip_weight: 1000.0
  kl_weight: 0.001
  free_bits: 0.0
  clip_reg_weight: 0.0
  recon_weight: 1.0
  # Recompute activations; weights and mathematical operations stay upstream-compatible.
  activation_checkpointing: true
  ddconfig:
    double_z: false
    z_channels: 256
    resolution: 512
    in_channels: 1
    out_ch: 1
    ch: 128
    ch_mult: [2, 4, 4]
    ada_length: 8192
    num_res_blocks: 2
    num_down_blocks: 1
    num_up_blocks: 1
    attn_resolutions: []
    dropout: 0.0
    maxpool: true
    attn_type: vanilla
    resamp_with_conv: true
training:
  seed: 42
  # Vanilla attention uses more memory than the current linear-attention VAE.
  batch_size: 6
  epochs: 30
  learning_rate: 0.0001
  weight_decay: 0.05
  num_workers: 0
  checkpoint_every_steps: 100
  kl_warmup_epochs: 0
  kl_ramp_epochs: 0
validation:
  fraction: 0.1
  split_seed: 42
  average_repeats: true
  selection_metric: latent_cosine
  selection_mode: max
  patience: 10
  min_delta: 0.0001
preprocessing:
  nsd_stored_divisor: 2000.0
  common_divisor: 2000.0
  normalization: beta_scale
  epsilon: 0.000001
  chunk_images: 64
  verify_nsd_sample: true
run_name: brainvae_ppbe_local
output_root: outputs/ppbe_comparison
log_root: logs/brainvae_ppbe_local
data_tag: ppbe_beta2000_v1
evaluation:
  aggregation: mean_fmri
  encode_batch_size: 2
  num_samples: 3
  num_steps: 38
  seed: 42
  rgb_mode: standard
  generation_tag: mean_fmri_rgb01_s3
  token_source_tag: mean_fmri
  unclip_checkpoint: huggingface/unclip6_epoch0_step110000.ckpt
